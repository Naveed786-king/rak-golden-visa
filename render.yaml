# One-click deploy on Render.com (New → Blueprint → choose this repo).
# The disk keeps your database and uploaded files safe between deploys.
services:
  - type: web
    name: rak-golden-visa
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/me
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        value: file:/var/data/data.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@rakgoldenvisa.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
