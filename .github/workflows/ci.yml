name: Build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CiPassword123
      UPLOAD_DIR: uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/auth/me >/dev/null && break; sleep 2; done
      - name: Smoke test
        run: |
          set -e
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check / 200
          check /about-us 200
          check /services 200
          check /ras-al-khaimah-property-golden-visa 200
          check /ras-al-khaimah-retirement-visa 200
          check /contact-us 200
          check /latest-news-blogs 200
          check /ras-al-khaimah-golden-visa-guide-2026 200
          check /apply 200
          check /login 200
          check /admin/login 200
          check /sitemap.xml 200
          check /does-not-exist 404
          curl -sf -X POST http://localhost:3000/api/leads -H 'Content-Type: application/json' -d '{"name":"CI Test","phone":"+971500000000","service":"RAK Retirement Visa"}'
          echo
          curl -sf -c cookies.txt -X POST http://localhost:3000/api/auth/login -H 'Content-Type: application/json' -d '{"email":"admin@example.com","password":"CiPassword123","admin":true}'
          echo
          curl -sf -b cookies.txt http://localhost:3000/api/admin/leads | grep -q "CI Test"
          curl -sf -b cookies.txt http://localhost:3000/api/admin/pages | grep -q "about-us"
          code=$(curl -s -o /dev/null -w "%{http_code}" -b cookies.txt http://localhost:3000/admin); echo "/admin -> $code"; [ "$code" = "200" ]
          echo "All smoke tests passed"
      - name: Server log
        if: always()
        run: tail -n 120 server.log || true
